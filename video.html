<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피자 매장 실적 인사이트</title>
<meta name="description" content="9개 매장 실적 분석 결과를 30초로 정리한 영상입니다.">
<style>
  :root { --bg: #0B1426; --ink: #F4F6FA; --mute: #8E9BB5; --amb: #FFB547; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  main { width: 100%; max-width: 1080px; display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { color: var(--amb); font-size: 14px; font-weight: 700; margin: 0; }
  h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); letter-spacing: -0.02em; }
  p.sub { margin: 0; color: var(--mute); font-size: 15px; line-height: 1.5; }
  video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  a { color: var(--amb); }
  footer { color: var(--mute); font-size: 13px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">매장 실적 진단 · 고객사 보고</p>
  <h1>피자 9개 매장, 핵심은 세 가지</h1>
  <p class="sub">2020년 1월부터 2026년 8월까지의 실적을 분석한 결과를 30초로 정리했습니다. 소리를 켜고 재생해 주세요.</p>
  <video src="pizza_insights_30s.mp4" controls playsinline preload="metadata"></video>
  <footer>영상이 재생되지 않으면 <a href="pizza_insights_30s.mp4">파일을 직접 여세요</a>.</footer>
</main>
</body>
</html>
